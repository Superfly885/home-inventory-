<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1677ff"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><title>Home Inventory</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f5f5f7;color:#111}.wrap{max-width:700px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card,button,input{border-radius:14px}.card{background:white;padding:16px;margin:10px 0}button{border:0;padding:12px;font-size:16px;background:#1677ff;color:white}.secondary{background:#e9e9ee;color:#111}.cat{width:100%;text-align:left;background:white;color:#111;border:1px solid #ddd}.low{outline:3px solid #ff3b30}.badge{background:#ff3b30;color:white;border-radius:999px;padding:4px 8px;font-size:12px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.editform{margin-top:12px;padding-top:12px;border-top:1px solid #ddd}.editgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.editgrid label{font-size:13px}.editgrid input{width:100%;margin-top:4px}.editname{grid-column:1/-1}.hidden{display:none}input{padding:10px;border:1px solid #ccc;font-size:16px;box-sizing:border-box}.shop{display:flex;gap:10px;align-items:center}@media print{button,.noprint{display:none!important}body{background:white}.card{border-bottom:1px solid #ccc}}</style></head><body><div class="wrap"><div id="home"><div class="top"><div><h1>Home Inventory</h1><p>Household supplies at a glance</p></div><span id="alert"></span></div><button id="shopBtn" style="width:100%">🛍 Shopping List (<span id="shopCount">0</span>)</button><div id="cats" class="grid"></div></div><div id="category" class="hidden"><button class="secondary back">← Home</button><h1 id="catTitle"></h1><div id="items"></div><div class="card"><h3>Add item</h3><input id="name" placeholder="Item name" style="width:100%;margin-bottom:8px"><div class="row"><input id="qty" type="number" min="0" value="1" style="width:48%"><input id="low" type="number" min="0" value="1" style="width:48%"></div><button id="add" style="width:100%;margin-top:8px">Add Item</button></div></div><div id="shopping" class="hidden"><button class="secondary back">← Home</button><div class="top"><h1>Shopping List</h1><button onclick="print()">Print</button></div><div id="shopItems"></div><div class="card noprint"><div class="row"><input id="manual" placeholder="Add something else" style="flex:1"><button id="manualAdd">Add</button></div></div></div></div><script>
const defaults=[{id:'paper',name:'Paper Products',icon:'🧻',items:[['Toilet Paper',12,6],['Paper Towels',5,3],['Tissues',4,2],['Napkins',3,2]]},{id:'clean',name:'Cleaning Supplies',icon:'🧽',items:[['Dish Soap',2,1],['Laundry Detergent',1,1],['Trash Bags',8,3],['Disinfecting Wipes',2,2]]},{id:'grocery',name:'Groceries',icon:'🛒',items:[['Milk',1,1],['Eggs',12,6],['Bread',2,1],['Cereal',3,1]]}].map(c=>({...c,items:c.items.map(i=>({name:i[0],qty:i[1],low:i[2]}))}));
let s=JSON.parse(localStorage.getItem('homeInventory')||'null')||{categories:defaults,manual:[],checked:{},active:null};const save=()=>localStorage.setItem('homeInventory',JSON.stringify(s));const low=i=>i.qty<=i.low;const auto=()=>s.categories.flatMap(c=>c.items.filter(low).map(i=>({key:c.id+'-'+i.name,name:i.name,cat:c.name,qty:i.qty})));
function view(id){['home','category','shopping'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}function renderHome(){const box=document.getElementById('cats');box.innerHTML='';let n=0;s.categories.forEach(c=>{let l=c.items.filter(low).length;n+=l;let b=document.createElement('button');b.className='cat card '+(l?'low':'');b.innerHTML=`<div class=row><span style="font-size:30px">${c.icon}</span>${l?`<span class=badge>${l} low</span>`:''}</div><h3>${c.name}</h3><small>${c.items.length} items</small>`;b.onclick=()=>{s.active=c.id;renderCat();view('category')};box.appendChild(b)});document.getElementById('alert').innerHTML=n?`<span class=badge>${n} low</span>`:'All stocked';document.getElementById('shopCount').textContent=auto().length+s.manual.length}
function renderCat(){let c=s.categories.find(x=>x.id===s.active);document.getElementById('catTitle').textContent=c.icon+' '+c.name;let box=document.getElementById('items');box.innerHTML='';c.items.forEach((i,k)=>{let d=document.createElement('div');d.className='card '+(low(i)?'low':'');d.innerHTML=`<div class=row><div><b>${i.name}</b><br><small>Low at ${i.low} or fewer</small></div><div><b style="font-size:28px">${i.qty}</b><br><small>remaining</small></div></div>${low(i)?'<p>⚠️ Running low — on shopping list</p>':''}<div class=actions><button data-u=${k} class=secondary>Used One</button><button data-a=${k}>+ Add One</button></div><button data-e=${k} class=secondary style="width:100%;margin-top:8px">Edit Item</button><div id=edit-${k} class="editform hidden"><div class=editgrid><label class=editname>Item name<input data-en=${k} value="${i.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"></label><label>Current quantity<input data-eq=${k} type=number min=0 value=${i.qty}></label><label>Low-stock alert<input data-el=${k} type=number min=0 value=${i.low}></label></div><div class=actions style="margin-top:8px"><button data-cancel=${k} class=secondary>Cancel</button><button data-save=${k}>Save Changes</button></div></div>`;box.appendChild(d)});box.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{c.items[b.dataset.u].qty=Math.max(0,c.items[b.dataset.u].qty-1);save();renderCat();renderHome()});box.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{c.items[b.dataset.a].qty++;save();renderCat();renderHome()});box.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>document.getElementById('edit-'+b.dataset.e).classList.remove('hidden'));box.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>document.getElementById('edit-'+b.dataset.cancel).classList.add('hidden'));box.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{let k=+b.dataset.save,name=box.querySelector('[data-en="'+k+'"]').value.trim(),qty=Math.max(0,+box.querySelector('[data-eq="'+k+'"]').value||0),threshold=Math.max(0,+box.querySelector('[data-el="'+k+'"]').value||0);if(!name)return;c.items[k].name=name;c.items[k].qty=qty;c.items[k].low=threshold;save();renderCat();renderHome()})}
function renderShop(){let items=[...auto(),...s.manual.map((x,i)=>({key:'m'+i,name:x,cat:'Other'}))],box=document.getElementById('shopItems');box.innerHTML=items.length?'':'<div class=card>Your shopping list is empty.</div>';items.forEach(x=>{let d=document.createElement('div');d.className='card shop';d.innerHTML=`<input type=checkbox ${s.checked[x.key]?'checked':''}><div style="flex:1"><b>${x.name}</b><br><small>${x.cat}${x.qty!==undefined?' • '+x.qty+' left':''}</small></div>`;d.querySelector('input').onchange=e=>{s.checked[x.key]=e.target.checked;save()};box.appendChild(d)})}
document.querySelectorAll('.back').forEach(b=>b.onclick=()=>{view('home');renderHome()});document.getElementById('shopBtn').onclick=()=>{renderShop();view('shopping')};document.getElementById('add').onclick=()=>{let c=s.categories.find(x=>x.id===s.active),name=document.getElementById('name').value.trim();if(!name)return;c.items.push({name,qty:+document.getElementById('qty').value||0,low:+document.getElementById('low').value||0});document.getElementById('name').value='';save();renderCat();renderHome()};document.getElementById('manualAdd').onclick=()=>{let x=document.getElementById('manual');if(!x.value.trim())return;s.manual.push(x.value.trim());x.value='';save();renderShop();renderHome()};renderHome();
</script></body></html>
